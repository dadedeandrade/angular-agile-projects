<mat-dialog-content class="mat-typography">
  <h2 mat-dialog-title>Adicionar Tarefa</h2>
  <form [formGroup]="taskForm" (ngSubmit)="addTask()" class="dialog-form">
    <mat-form-field>
      <mat-label>Título</mat-label>
      <input maxlength="17" #title matInput formControlName="title" required />
      <mat-hint align="end">{{ title.value.length }} / 17</mat-hint>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Descrição</mat-label>
      <textarea
        maxlength="256"
        #description
        matInput
        formControlName="description"
        rows="3"
      ></textarea>
      <mat-hint align="end">{{ description.value.length }} / 256</mat-hint>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Prioridade</mat-label>
      <mat-select formControlName="priority">
        <mat-option value="Baixa">Baixa</mat-option>
        <mat-option value="Média">Média</mat-option>
        <mat-option value="Alta">Alta</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="Pendente">Pendente</mat-option>
        <mat-option value="Em Progresso">Em Progresso</mat-option>
        <mat-option value="Concluído">Concluído</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="start">
  <button mat-raised-button type="submit" color="primary" (click)="addTask()">
    Salvar
  </button>
  <button mat-raised-button color="warn" (click)="closeDialog()">Fechar</button>
</mat-dialog-actions>
