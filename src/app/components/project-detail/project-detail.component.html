<div
  *ngIf="selectedProject"
  class="project-detail"
  [class.project-detail--is-mobile]="isMobile"
>
  <mat-toolbar class="project-detail__toolbar">
    <button mat-icon-button (click)="snav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>

    <button mat-icon-button (click)="handleAddTaskClick()">
      <mat-icon>add</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container
    class="project-detail__sidenav-container"
    [style.marginTop.px]="isMobile ? 56 : 0"
  >
    <mat-sidenav
      #snav
      [mode]="isMobile ? 'over' : 'side'"
      [fixedInViewport]="isMobile"
      fixedTopGap="56"
      [opened]="!isMobile"
      class="project-detail__sidenav"
    >
      <h2>Informações do projeto:</h2>
      <mat-divider></mat-divider>

      <mat-list *ngIf="selectedProject">
        <mat-list-item class="project-detail__sidenav-description">
          <span matListItemTitle>Nome: {{ selectedProject.name }}</span>
          <span
            *ngIf="selectedProject.description"
            class="project-detail__sidenav-description-text"
          >
            {{ selectedProject.description }}
          </span>
        </mat-list-item>

        <mat-list-item>
          <app-project-status-chip
            [status]="selectedProject.status"
            [completedAt]="selectedProject.completedAt"
          ></app-project-status-chip>
        </mat-list-item>

        <mat-list-item>
          <span matListItemTitle
            >Data de criação: {{ selectedProject.createdAt }}</span
          >
        </mat-list-item>

        <mat-list-item *ngIf="selectedProject.completedAt">
          <span matListItemTitle
            >Data de conclusão: {{ selectedProject.completedAt }}</span
          >
        </mat-list-item>
      </mat-list>

      <button mat-button>Editar projeto</button>
    </mat-sidenav>

    <mat-sidenav-content class="task-list-container">
      <h2>Tarefas</h2>
      <div class="task-list">
        <app-task-card
          *ngFor="let task of selectedProject.tasks"
          [task]="task"
          [projectId]="selectedProject.id"
        ></app-task-card>
      </div>

      <p *ngIf="selectedProject.tasks.length == 0">
        Este projeto ainda não há tarefas, comece criando uma :)
      </p>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
