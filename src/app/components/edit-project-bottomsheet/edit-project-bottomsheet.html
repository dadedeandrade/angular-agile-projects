<mat-nav-list>
  <h2>Editar Projeto</h2>
  <form class="edit-form" [formGroup]="projectForm">
    <mat-form-field>
      <mat-label>Nome do Projeto</mat-label>
      <input
        maxlength="17"
        #projectName
        matInput
        formControlName="name"
        required
      />
      <mat-hint align="end">{{ projectName.value.length }} / 17</mat-hint>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Descrição</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="Em andamento">Em andamento</mat-option>
        <mat-option value="Concluído">Concluído</mat-option>
        <mat-option value="Planejado">Planejado</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Data de Criação</mat-label>
      <input matInput formControlName="createdAt" type="date" />
    </mat-form-field>

    <mat-form-field *ngIf="projectForm.get('status')?.value == 'Concluído'">
      <mat-label>Data de Conclusão</mat-label>
      <input matInput formControlName="completedAt" type="date" />
      <mat-hint>Preencha a data de conclusão</mat-hint>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      (click)="handleEditProjectButton($event)"
    >
      Salvar
    </button>

    <button
      mat-raised-button
      color="primary"
      (click)="handleCancelEditProjectButton($event)"
    >
      Cancelar
    </button>
  </form>
</mat-nav-list>
